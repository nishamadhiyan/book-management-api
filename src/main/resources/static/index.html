<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Management System</title>
<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #f4f6f8; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #333; }
  .container { max-width: 900px; margin: auto; }
  .form-card, .search-card {
    background: white; padding: 20px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px;
  }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-row input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-width: 120px; }
  .form-row label { display: flex; align-items: center; gap: 5px; }
  button {
    padding: 8px 16px; border: none; border-radius: 4px;
    background: #2563eb; color: white; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.secondary { background: #6b7280; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #f0f0f0; }
  .actions { display: flex; gap: 6px; }
  #formTitle { margin-top: 0; }
</style>
</head>
<body>
<div class="container">
  <h1>📚 Book Management System</h1>

  <div class="form-card">
    <h3 id="formTitle">Add a New Book</h3>
    <input type="hidden" id="bookId">
    <div class="form-row">
      <input type="text" id="title" placeholder="Title">
      <input type="text" id="author" placeholder="Author">
      <input type="text" id="category" placeholder="Category">
    </div>
    <div class="form-row">
      <input type="number" id="price" placeholder="Price" step="0.01">
      <label><input type="checkbox" id="available" checked> Available</label>
      <button onclick="saveBook()" id="saveBtn">Add Book</button>
      <button class="secondary" onclick="resetForm()" id="cancelBtn" style="display:none;">Cancel Edit</button>
    </div>
  </div>

  <div class="search-card">
    <div class="form-row">
      <input type="text" id="searchCategory" placeholder="Search by category">
      <button onclick="searchByCategory()">Search</button>
      <button class="secondary" onclick="loadBooks()">Show All</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>Price</th><th>Available</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="bookTableBody"></tbody>
  </table>
</div>

<script>
const API_URL = 'http://localhost:8080/books';

async function loadBooks() {
  const res = await fetch(API_URL);
  const books = await res.json();
  renderBooks(books);
}

async function searchByCategory() {
  const category = document.getElementById('searchCategory').value.trim();
  if (!category) { loadBooks(); return; }
  const res = await fetch(`${API_URL}/category/${encodeURIComponent(category)}`);
  const books = await res.json();
  renderBooks(books);
}

function renderBooks(books) {
  const tbody = document.getElementById('bookTableBody');
  tbody.innerHTML = '';
  books.forEach(book => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${book.id}</td>
      <td>${book.title}</td>
      <td>${book.author}</td>
      <td>${book.category ?? ''}</td>
      <td>₹${book.price}</td>
      <td>${book.available ? 'Yes' : 'No'}</td>
      <td class="actions">
        <button onclick='editBook(${JSON.stringify(book)})'>Edit</button>
        <button class="danger" onclick="deleteBook(${book.id})">Delete</button>
      </td>
    `;
    tbody.appendChild(row);
  });
}

async function saveBook() {
  const id = document.getElementById('bookId').value;
  const book = {
    title: document.getElementById('title').value,
    author: document.getElementById('author').value,
    category: document.getElementById('category').value,
    price: parseFloat(document.getElementById('price').value),
    available: document.getElementById('available').checked
  };

  if (!book.title || !book.author || !(book.price > 0)) {
    alert('Title and Author are required, and Price must be greater than 0');
    return;
  }

  const url = id ? `${API_URL}/${id}` : API_URL;
  const method = id ? 'PUT' : 'POST';

  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(book)
  });

  if (!res.ok) {
    alert('Something went wrong. Check console.');
    console.error(await res.text());
    return;
  }

  resetForm();
  loadBooks();
}

function editBook(book) {
  document.getElementById('bookId').value = book.id;
  document.getElementById('title').value = book.title;
  document.getElementById('author').value = book.author;
  document.getElementById('category').value = book.category ?? '';
  document.getElementById('price').value = book.price;
  document.getElementById('available').checked = book.available;
  document.getElementById('formTitle').innerText = 'Edit Book';
  document.getElementById('saveBtn').innerText = 'Update Book';
  document.getElementById('cancelBtn').style.display = 'inline-block';
}

function resetForm() {
  document.getElementById('bookId').value = '';
  document.getElementById('title').value = '';
  document.getElementById('author').value = '';
  document.getElementById('category').value = '';
  document.getElementById('price').value = '';
  document.getElementById('available').checked = true;
  document.getElementById('formTitle').innerText = 'Add a New Book';
  document.getElementById('saveBtn').innerText = 'Add Book';
  document.getElementById('cancelBtn').style.display = 'none';
}

async function deleteBook(id) {
  if (!confirm('Delete this book?')) return;
  await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
  loadBooks();
}

loadBooks();
</script>
</body>
</html>
